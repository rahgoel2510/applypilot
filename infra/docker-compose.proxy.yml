version: "3.8"
services:
  caddy:
    image: caddy:2-alpine
    container_name: applypilot-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - tracker
    networks:
      - applypilot-net
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m

  tracker:
    build:
      context: ..
      dockerfile: tracker/Dockerfile.tracker
    container_name: applypilot-backend
    expose:
      - "8000"
    env_file:
      - ../.env
    volumes:
      - applypilot-data:/app/data
    restart: unless-stopped
    networks:
      - applypilot-net
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 2g

volumes:
  applypilot-data:
  caddy_data:
  caddy_config:

networks:
  applypilot-net:
    driver: bridge
