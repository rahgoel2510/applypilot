version: "3.8"

services:
  applypilot:
    build:
      context: .
      dockerfile: tracker/Dockerfile
    image: rahgoel2510/applypilot:latest
    container_name: applypilot
    ports:
      - "8000:8000"
    volumes:
      - applypilot-data:/app/data
      - applypilot-browser:/home/pwuser/.local/share/linkedin_agent
      # ── Mount your local LinkedIn session into the container ──
      # Uncomment ONE of these based on your OS:
      #
      # macOS:
      # - ~/Library/Application Support/linkedin_agent/browser_data:/home/pwuser/.local/share/linkedin_agent/browser_data
      #
      # Windows:
      # - ${LOCALAPPDATA}/linkedin_agent/browser_data:/home/pwuser/.local/share/linkedin_agent/browser_data
      #
      # Linux:
      # - ~/.local/share/linkedin_agent/browser_data:/home/pwuser/.local/share/linkedin_agent/browser_data
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:///./data/tracker.db
      - TZ=Asia/Kolkata
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/stats')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  applypilot-data:
    driver: local
  applypilot-browser:
    driver: local
