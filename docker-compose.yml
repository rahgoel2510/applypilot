version: "3.8"

# ═══════════════════════════════════════════════════════════════
# ApplyPilot — Docker Compose (Security-Hardened)
# ═══════════════════════════════════════════════════════════════
# This runs the TRACKER (web UI) only.
# The AGENT runs natively on your machine (where LinkedIn session lives).
#
# Setup:
#   1. docker-compose up -d          ← starts tracker at localhost:8000
#   2. python -m linkedin_agent run  ← runs agent (uses your local session)
#
# The agent auto-pushes results to the tracker via HTTP.
# ═══════════════════════════════════════════════════════════════

services:
  tracker:
    build:
      context: .
      dockerfile: tracker/Dockerfile.tracker
    image: rahgoel2510/applypilot-tracker:latest
    container_name: applypilot
    ports:
      - "80:8000"
    env_file:
      - .env
    volumes:
      - applypilot-data:/app/data
      - applypilot-browser:/home/applypilot/.local/share/linkedin_agent
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:///./data/tracker.db
      - TZ=Asia/Kolkata
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/stats')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Security hardening
    user: "1000:1000"
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /app/data
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: '2.0'

volumes:
  applypilot-data:
    driver: local
  applypilot-browser:
    driver: local
