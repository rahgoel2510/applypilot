version: "3.8"

services:
  applypilot:
    build:
      context: .
      dockerfile: tracker/Dockerfile
    image: rahgoel2510/applypilot:latest
    container_name: applypilot
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - applypilot-data:/app/data
      - applypilot-browser:/root/.local/share/linkedin_agent
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:///./data/tracker.db
      - TZ=Asia/Kolkata
      - HOME=/root
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/stats')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  applypilot-data:
    driver: local
  applypilot-browser:
    driver: local
