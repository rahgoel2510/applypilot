[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-job-agent"
version = "0.1.0"
description = "Automated LinkedIn job application agent"
requires-python = ">=3.10"
dependencies = [
    "playwright",
    "python-telegram-bot>=20.0",
    "pyyaml",
    "python-dotenv",
    "openai",
    "apscheduler",
    "platformdirs",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov",
    "pytest-mock",
]

[project.scripts]
linkedin-agent = "linkedin_agent.__main__:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require external services (Telegram, LinkedIn)",
]
